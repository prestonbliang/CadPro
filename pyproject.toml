[project]
name = "cadpro"
version = "1.0.0"
description = "Turn complete photo or video orbits into validated STEP and mesh geometry."
requires-python = ">=3.10"
dependencies = [
    "cadquery-ocp-novtk",
    "numpy",
    "scipy",
    "networkx",
    "rich",
    "typer",
    "pygltflib",
    "jinja2",
    "opencv-python-headless>=4.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27"]

[project.scripts]
cadpro = "cadpro.cli:app"
cad-diff = "cad_diff.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_diff = ["viewer/*.j2", "viewer/*.js", "viewer/vendor/*.js"]
cadpro = ["web_assets/*"]
