[project]
name = "cadpro"
version = "2.2.0"
description = "Create validated measured STEP models and optional generative visual 3D assets from text, images, or video."
readme = "README.md"
authors = [
    { name = "Preston L" },
    { name = "Ethan C", email = "yil91974@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "cadquery-ocp-novtk",
    "numpy",
    "scipy",
    "networkx",
    "rich",
    "typer",
    "pygltflib",
    "jinja2",
    "opencv-python-headless>=4.10",
    "Pillow>=10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "openai>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27"]

[project.scripts]
cadpro = "cadpro.cli:app"
cad-diff = "cad_diff.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_diff = ["viewer/*.j2", "viewer/*.js", "viewer/vendor/*.js"]
cadpro = ["web_assets/*"]
