[project]
name = "cadpro"
version = "0.1.0"
description = "Convert image and video silhouettes into editable, solid STEP geometry."
requires-python = ">=3.10"
dependencies = [
    "cadquery-ocp-novtk",
    "numpy",
    "scipy",
    "networkx",
    "rich",
    "typer",
    "pygltflib",
    "jinja2",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cadpro = "cadpro.cli:app"
cad-diff = "cad_diff.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_diff = ["viewer/*.j2", "viewer/*.js", "viewer/vendor/*.js"]
